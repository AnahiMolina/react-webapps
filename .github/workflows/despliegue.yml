# Nombre del flujo de trabajo
name: Puesta a produccion

# Cuando se ejecuta?
on:
  push:
    branches: ['main']

# Permisos
permissions:
  contents: read
  pages: write
  id-token: write

# Habilitar la concurrencia (ejecutar dos cosas a la vez)
concurrency:
  group: 'pages'
  cancel-in-progress: true

# Trabajos 
jobs:
  # Nombre del trabajo
  desplegar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Pasos para seguir el despliegue
    steps:
      - name: Verificar
        uses: actions/checkout@v4

      - name: Configurar NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Construir
        run: npm run build

      - name: Configurar Github Pages
        uses: actions/configure-pages@v4

      - name: Cargar los archivos
        uses: actions/upload-pages-artifact@v3
        with:
          # Ruta de los archivos para cargar
          path: './dist'

      - name: Desplegar to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
